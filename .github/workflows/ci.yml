name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=reports/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/tests.xml
      - run: docker compose -p taskflow-ci up -d --build --wait --wait-timeout 120
      - run: python scripts/smoke.py
      - run: docker compose -p taskflow-ci logs
        if: failure()
      - run: docker compose -p taskflow-ci down -v
        if: always()
